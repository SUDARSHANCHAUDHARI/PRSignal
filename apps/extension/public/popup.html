<!doctype html>
<html>
  <head><meta charset="utf-8"><title>PRSignal</title><style>body{font-family:Inter,system-ui,sans-serif;width:320px;padding:16px;background:#0b0f14;color:#e5e7eb}input{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid #374151;background:#111827;color:#e5e7eb}button{width:100%;padding:10px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700}small{color:#9ca3af}</style></head>
  <body>
    <h2>PRSignal</h2>
    <small>Add your backend URL and extension token from /admin/users.</small>
    <label>Backend URL</label>
    <input id="apiUrl" placeholder="http://localhost:4000" />
    <label>Extension Token</label>
    <input id="token" placeholder="JWT token" />
    <button id="save">Save</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
